version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Os pacotes @angular/* se prendem à mesma versão por peer dependency: precisam subir juntos.
      angular:
        patterns:
          - "@angular/*"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
