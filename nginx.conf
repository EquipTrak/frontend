server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Arquivos com hash no nome podem ficar em cache por 1 ano.
  location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html nunca em cache, para o navegador sempre pegar a versão nova.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Rotas do Angular (SPA): qualquer caminho cai no index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
